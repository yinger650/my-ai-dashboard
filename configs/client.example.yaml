version: 1

server:
  url: "http://127.0.0.1:8080"
  # The machine token is read from this environment variable, never from the file.
  machine_token_env: "ABP_MACHINE_TOKEN"
  timeout: 20s
  tls_insecure_skip_verify: false

machine:
  key: "home-server"
  display_name: "家庭服务器"

storage:
  spool_path: "/var/lib/agentboard-client/spool.db"
  max_events: 50000

intervals:
  collect: 60s
  heartbeat: 30s
  metrics: 30s
  ports: 60s
  systemd: 60s
  cursor_agent: 5m
  http: 60s

collectors:
  cpu: true
  memory: true
  filesystems:
    enabled: true
    include_mounts: ["/"]
    exclude_fs_types: ["tmpfs", "devtmpfs", "overlay", "squashfs"]
  disk_io:
    enabled: true
  network:
    enabled: true
    exclude_interfaces: ["lo", "veth*", "docker*"]
  ports:
    enabled: true
    promote:
      - process: nginx
        service_key: nginx
        name: Nginx
      - process: sshd
        service_key: sshd
        name: sshd
      - process: board-server
        service_key: board-server
        name: Board Server
  docker:
    enabled: true
  cron:
    enabled: true
  nginx:
    enabled: true
    config_paths:
      - /etc/nginx
      - /www/server/nginx/conf
  systemd:
    enabled: false
    include_all: false
    include:
      - board-server.service
      - board-client.service
      - nginx.service
      - sshd.service
      - docker.service
      - crond.service
    exclude_prefixes:
      - systemd-
      - user@
      - getty@
      - session-
  cursor_agent:
    enabled: false
    service_key: cursor-agent
    service_name: Cursor Agent
    pin_summary: true
    paths:
      - /root/.cursor/projects
      - /root/.cursor-server
  http:
    enabled: false
    timeout: 10s
    follow_redirects: true
    warn_latency: 3s
    ttl_seconds: 180
    targets:
      - service_key: site-board
        name: AgentBoard
        url: "https://board.yinger650.com/health/live"
        method: GET
        expect_status: [200]
