version: 1

server:
  url: "http://127.0.0.1:8080"
  # The machine token is read from this environment variable, never from the file.
  machine_token_env: "ABP_MACHINE_TOKEN"
  timeout: 20s
  tls_insecure_skip_verify: false

machine:
  key: "home-server"
  display_name: "家庭服务器"

storage:
  spool_path: "/var/lib/agentboard-client/spool.db"
  max_events: 50000

intervals:
  collect: 60s
  heartbeat: 30s
  metrics: 30s
  ports: 60s
  systemd: 60s
  cursor_agent: 5m
  http: 60s

local_ingest:
  enabled: true
  listen: "127.0.0.1:7438"
  advertise_path: "/var/lib/agentboard-client/local-ingest.json"
  # Loopback copy of agent events. board-client projects them to proj-*
  # with this client's token and tees log.append for AI digest.

update:
  enabled: false
  # 国内机器请改成看板自己的镜像，避免直连 GitHub Release（会 302 到 Azure CDN）：
  # url: "http://127.0.0.1:8090/client-updates"
  # url: "https://board.yinger650.com/client-updates"
  url: "https://github.com/yinger650/my-ai-dashboard/releases/latest/download"
  interval: 1h

collectors:
  cpu: true
  memory: true
  filesystems:
    enabled: true
    include_mounts: ["/"]
    exclude_fs_types: ["tmpfs", "devtmpfs", "overlay", "squashfs"]
  disk_io:
    enabled: true
  network:
    enabled: true
    exclude_interfaces: ["lo", "veth*", "docker*"]
  ports:
    enabled: true
    promote:
      - process: nginx
        service_key: nginx
        name: Nginx
      - process: sshd
        service_key: sshd
        name: sshd
      - process: board-server
        service_key: board-server
        name: Board Server
  docker:
    enabled: true
  cron:
    enabled: true
  nginx:
    enabled: true
    config_paths:
      - /etc/nginx
      - /www/server/nginx/conf
      - /www/server/panel/vhost/nginx
  systemd:
    enabled: false
    include_all: false
    include:
      - board-server.service
      - board-client.service
      - nginx.service
      - sshd.service
      - docker.service
      - crond.service
    exclude_prefixes:
      - systemd-
      - user@
      - getty@
      - session-
  cursor_agent:
    enabled: false
    service_key: cursor-agent
    service_name: Cursor Agent
    pin_summary: true
    paths:
      - /root/.cursor/projects
      - /root/.cursor-server
  http:
    enabled: false
    timeout: 10s
    follow_redirects: true
    warn_latency: 3s
    ttl_seconds: 180
    targets:
      - service_key: site-board
        name: AgentBoard
        url: "https://board.yinger650.com/health/live"
        method: GET
        expect_status: [200]
  probes:
    enabled: false
    scripts:
      - service_key: gpu
        name: GPU 节点
        command: ["/etc/agentboard/probes/gpu.sh"]
        interval: 60s
        timeout: 15s
        format: json
        ttl_seconds: 180

ai:
  enabled: false
  provider: cursor-agent        # cursor-agent | codex | command
  api_key_env: "CURSOR_API_KEY"
  workspace: "/var/lib/agentboard-client/ai-workspace"
  timeout: 120s
  max_calls_per_day: 48
  max_input_bytes: 32768
  max_output_runes: 3000
  fallback_heuristic: true
  summarize:
    - source: agent_logs
      service_key: ai-agent-digest
      name: Agent 日志总结
      interval: 15m
      min_new_logs: 3
      prompt: "重点关注任务失败与卡住的原因"
  discover:
    enabled: false
    service_key: ai-inspect
    name: AI 主机巡检
    interval: 6h
    ttl_seconds: 43200
    max_investigations: 8
    allow_commands:
      - id: unit_status
        argv: ["systemctl", "status", "--no-pager", "-n", "50", "{unit}"]
      - id: unit_journal
        argv: ["journalctl", "--no-pager", "-n", "200", "-u", "{unit}"]
      - id: read_file
        argv: ["cat", "{path}"]
        allow_paths: ["/var/log/**", "/etc/agentboard/**"]

