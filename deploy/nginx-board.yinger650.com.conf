server {
    listen 80;
    server_name board.yinger650.com;
    client_max_body_size 20m;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/panel_ssl;
        default_type text/plain;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    access_log /www/wwwlogs/board.yinger650.com.log;
    error_log  /www/wwwlogs/board.yinger650.com.error.log;
}

server {
    listen 443 ssl;
    http2 on;
    server_name board.yinger650.com;
    client_max_body_size 20m;

    ssl_certificate     /www/server/panel/vhost/cert/board.yinger650.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/board.yinger650.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    error_page 497 https://$host$request_uri;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/panel_ssl;
        default_type text/plain;
        allow all;
    }

    location ^~ /client-updates/ {
        client_max_body_size 80m;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    access_log /www/wwwlogs/board.yinger650.com.log;
    error_log  /www/wwwlogs/board.yinger650.com.error.log;
}
