version: 1

# 阿里云远程客户端：上报本机指标，并探测若干网站是否可访问。
# 安装到 /etc/agentboard/client.yaml ，Token 只放环境变量，不要写入本文件。

server:
  url: "https://board.yinger650.com"
  machine_token_env: "ABP_MACHINE_TOKEN"
  timeout: 20s
  tls_insecure_skip_verify: false

machine:
  key: "aliyun-web"
  display_name: "阿里云网站监控"

storage:
  spool_path: "/var/lib/agentboard-client/spool.db"
  max_events: 50000

intervals:
  collect: 60s
  heartbeat: 30s
  metrics: 30s
  ports: 60s
  systemd: 60s
  cursor_agent: 5m
  http: 60s

update:
  enabled: true
  url: "https://board.yinger650.com/client-updates"
  interval: 1h

local_ingest:
  enabled: true
  listen: "127.0.0.1:7438"
  advertise_path: "/var/lib/agentboard-client/local-ingest.json"

collectors:
  cpu: true
  memory: true
  filesystems:
    enabled: true
    include_mounts: ["/"]
    exclude_fs_types: ["tmpfs", "devtmpfs", "overlay", "squashfs"]
  disk_io:
    enabled: true
  network:
    enabled: true
    exclude_interfaces: ["lo", "veth*", "docker*"]
  ports:
    enabled: true
  docker:
    enabled: true
  cron:
    enabled: true
  nginx:
    enabled: true
  systemd:
    enabled: true
    include_all: false
    include:
      - board-client.service
      - nginx.service
      - sshd.service
    exclude_prefixes:
      - systemd-
      - user@
      - getty@
      - session-
  cursor_agent:
    enabled: false
    service_key: cursor-agent
    service_name: Cursor Agent
    pin_summary: true
    paths:
      - /root/.cursor/projects
      - /root/.cursor-server
  http:
    enabled: true
    timeout: 10s
    follow_redirects: true
    warn_latency: 3s
    ttl_seconds: 180
    targets:
      - service_key: site-board
        name: AgentBoard
        url: "https://board.yinger650.com/health/live"
        method: GET
        expect_status: [200]
      # yinger650.com / www 不是必须探测，默认不配。需要时再追加 target。
      # 继续追加站点：
      # - service_key: site-example
      #   name: 示例站
      #   url: "https://example.com/"
      #   method: GET
      #   expect_status: [200]
      #   expect_contains: ""
