# AgentBoard Feishu edition — board.min-wang.com
# Live copy: /etc/nginx/conf.d/board.min-wang.com.conf
# Upstream: board-server-feishu on 127.0.0.1:8091
# ACME webroot: /var/www/acme
# nginx 1.20: use `listen 443 ssl http2` (not `http2 on`).

server {
    listen 80;
    listen [::]:80;
    server_name board.min-wang.com;
    client_max_body_size 20m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    access_log /var/log/nginx/board.min-wang.com.log;
    error_log  /var/log/nginx/board.min-wang.com.error.log;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name board.min-wang.com;
    client_max_body_size 20m;

    ssl_certificate     /etc/letsencrypt/live/board.min-wang.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/board.min-wang.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    error_page 497 https://$host$request_uri;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        allow all;
    }

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    access_log /var/log/nginx/board.min-wang.com.log;
    error_log  /var/log/nginx/board.min-wang.com.error.log;
}
